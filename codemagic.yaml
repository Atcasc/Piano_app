workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build iOS without strict codesign
        script: |
          flutter build ios --release --no-codesign
      - name: Package IPA for Sideloadly
        script: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          # Crea la estructura Payload para que Sideloadly lo reconozca
          mkdir Payload
          mv Runner.app Payload/
          zip -r ../ipa/piano_app.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa