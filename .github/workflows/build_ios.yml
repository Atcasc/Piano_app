name: Build iOS App

on:
  push:
    branches: [ "main" ] # O "master" dependiendo de tu rama principal

jobs:
  build:
    name: Build iOS Artifact
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (Release for testing)
        run: flutter build ios --release --no-codesign

      - name: Package App for Sideloading
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r -y MyApp.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: build/ios/iphoneos/MyApp.ipa